name: Build Windows

# Compila ClimateStudio para Windows x64 y publica los .exe en un RELEASE
# (evita el limite de almacenamiento de artefactos del plan gratuito).
#  - Ejecucion manual (Run workflow): actualiza el release "latest".
#  - Empujar una etiqueta vX.Y.Z: crea un release con esa version.
#
# Este workflow NO genera ni sobrescribe ningun archivo del repositorio:
# solo verifica y compila lo que ya esta versionado. Todas las
# comprobaciones van embebidas aqui, sin depender de scripts externos.
#
# Acciones fijadas a majors que declaran runs.using: node24. GitHub retira
# Node 20 de los runners el 16 de septiembre de 2026; las acciones que sigan
# declarando node20 dejaran de arrancar. checkout@v5, setup-node@v5 y
# action-gh-release@v3 son los primeros majors con node24; el cambio en las
# tres es solo de runtime, sin diferencias de entradas ni de comportamiento.
# Existen majors posteriores (checkout v6/v7, setup-node v6): tambien valen,
# pero no aportan nada para este workflow.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # -- Diagnostico: deja constancia de lo que realmente hay en el runner --
      - name: Diagnostics
        shell: bash
        run: |
          echo "-- raiz del repositorio --"
          ls -l
          echo "-- build/ --"
          ls -l build/ 2>/dev/null || echo "(la carpeta build/ NO existe)"
          echo "-- scripts de package.json --"
          node -p "JSON.stringify(require('./package.json').scripts,null,2)"
          echo "-- configuracion de iconos --"
          node -p "JSON.stringify({buildResources:require('./package.json').build.directories.buildResources,winIcon:require('./package.json').build.win.icon,nsisKeys:Object.keys(require('./package.json').build.nsis)},null,2)"

      # -- Verificaciones baratas ANTES de descargar Electron (~150 MB) --
      - name: Verify sources
        shell: bash
        run: |
          fail=0

          # 1. El HTML de la aplicacion debe existir
          if [ ! -f ClimateStudio.html ]; then
            echo "::error::Falta ClimateStudio.html en la raiz del repositorio."
            fail=1
          fi

          # 2. El icono debe existir (lo exigen win.icon y el instalador NSIS)
          if [ ! -f build/icon.ico ]; then
            echo "::error::Falta build/icon.ico. Subelo con Add file > Upload files arrastrando la carpeta build completa."
            fail=1
          else
            echo "build/icon.ico: $(wc -c < build/icon.ico) bytes"
          fi

          # 3. La app debe ser autocontenida. Un solo recurso remoto la rompe
          #    en un equipo sin red, y no de forma elegante: si Chart.js no
          #    carga, la linea Chart.defaults aborta TODO el script en linea
          #    y media aplicacion deja de existir.
          if [ -f ClimateStudio.html ]; then
            if grep -qiE '(src|href)[[:space:]]*=[[:space:]]*"https?://' ClimateStudio.html; then
              echo "::error::ClimateStudio.html contiene recursos remotos (CDN)."
              grep -oiE '(src|href)[[:space:]]*=[[:space:]]*"https?://[^"]+' ClimateStudio.html
              fail=1
            else
              echo "ClimateStudio.html: sin recursos remotos"
            fi
            fonts=$(grep -o 'data:font/woff2;base64' ClimateStudio.html | wc -l)
            echo "ClimateStudio.html: $fonts tipografias embebidas"
            if [ "$fonts" -lt 3 ]; then
              echo "::error::Solo $fonts tipografias embebidas; se esperaban 14."
              fail=1
            fi
          fi

          exit $fail

      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist

      - name: List artifacts
        shell: bash
        run: ls -lh dist/*.exe

      - name: Publish to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Última compilación (latest)' }}
          files: dist/*.exe
          fail_on_unmatched_files: true
