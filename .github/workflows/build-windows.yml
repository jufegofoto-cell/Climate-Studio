name: Build Windows

# Compila ClimateStudio para Windows x64 y publica los .exe en un RELEASE
# (evita el limite de almacenamiento de artefactos del plan gratuito).
#  - Ejecucion manual (Run workflow): actualiza el release "latest".
#  - Empujar una etiqueta vX.Y.Z: crea un release con esa version.
#
# Este workflow NO genera ni sobrescribe ningun archivo del repositorio:
# solo compila lo que ya esta versionado.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Verificaciones baratas ANTES de instalar y descargar Electron:
      # si algo falta, el fallo llega en segundos y no a mitad del empaquetado.
      - name: Prepare application icon
        run: node scripts/make-icon.js

      # Diagnostico: deja constancia de lo que realmente hay en el runner.
      # Si algo vuelve a fallar por rutas, este paso lo resuelve en una lectura.
      - name: Diagnostics
        shell: bash
        run: |
          echo "── contenido de build/ ──"
          ls -l build/ || echo "(la carpeta build/ NO existe)"
          echo "── scripts declarados en package.json ──"
          node -p "JSON.stringify(require('./package.json').scripts,null,2)"
          echo "── configuracion de iconos ──"
          node -p "JSON.stringify({buildResources:require('./package.json').build.directories.buildResources, winIcon:require('./package.json').build.win.icon, nsis:Object.keys(require('./package.json').build.nsis)},null,2)"

      # La app debe ser autocontenida: un solo recurso remoto la rompe
      # en un equipo sin red. Si esto falla, no se compila nada.
      - name: Verify offline self-containment
        run: node scripts/check-offline.js

      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist

      - name: List artifacts
        shell: bash
        run: ls -lh dist/*.exe

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Última compilación (latest)' }}
          files: dist/*.exe
          fail_on_unmatched_files: true
